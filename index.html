<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zumbido</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.svg" type="image/svg+xml">
    <meta name="theme-color" content="#6366F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-light: #EEF2FF;
            --primary-ring: rgba(99,102,241,0.3);
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-hover: #F1F5F9;
            --border: #E2E8F0;
            --text: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #F59E0B;
            --online: #22C55E;
            --offline: #94A3B8;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --primary: #818CF8;
            --primary-hover: #6366F1;
            --primary-light: #1E1B4B;
            --primary-ring: rgba(129,140,248,0.3);
            --bg: #0F172A;
            --surface: #1E293B;
            --surface-hover: #334155;
            --border: #334155;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            transition: background var(--transition), color var(--transition);
        }

        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Screens */
        .screen { display: flex; flex-direction: column; flex: 1; }
        .hidden { display: none !important; }

        /* Auth */
        #auth-section {
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, #8B5CF6 100%);
            min-height: 100vh;
        }

        .auth-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: var(--shadow-lg);
        }

        .auth-card .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .auth-card h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .auth-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
        }

        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            width: auto;
            border-radius: var(--radius-xs);
        }

        .btn-accept {
            background: var(--success);
            color: white;
        }
        .btn-accept:hover { background: #16A34A; }

        .btn-reject {
            background: var(--danger);
            color: white;
        }
        .btn-reject:hover { background: #DC2626; }

        .btn-cancel {
            background: var(--text-muted);
            color: white;
        }
        .btn-cancel:hover { background: var(--text-secondary); }

        .btn-add {
            background: var(--primary);
            color: white;
        }
        .btn-add:hover { background: var(--primary-hover); }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-left .logo-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .header-left .logo-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .icon-btn {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
            color: var(--text-secondary);
        }

        .icon-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* User Card */
        .user-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--surface-hover);
            flex-shrink: 0;
        }

        .avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--surface-hover);
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .user-status {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .user-status.online { color: var(--online); }
        .user-status.offline { color: var(--offline); }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 57px;
            z-index: 9;
        }

        .tab {
            flex: 1;
            padding: 0.7rem 0.5rem;
            background: none;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .tab:hover { color: var(--text-secondary); }

        .tab.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
        }

        .tab .badge {
            background: var(--danger);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            line-height: 1.3;
        }

        .tab .badge.hidden { display: none; }

        /* Tab Content */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            margin-top: 0.75rem;
        }

        .section-title:first-child { margin-top: 0; }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 2rem 0;
        }

        /* Items (contacts, requests, search results) */
        .item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            transition: all var(--transition);
        }

        .item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .item .name {
            font-size: 0.9rem;
            font-weight: 500;
            flex: 1;
            text-align: left;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online { background: var(--online); }
        .status-dot.offline { background: var(--offline); }

        .buzz-btn {
            background: transparent;
            border: 1.5px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .buzz-btn:hover {
            background: #FEE2E2;
            border-color: #FCA5A5;
        }

        .badge-label {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .badge-contact {
            background: #DCFCE7;
            color: #15803D;
        }

        [data-theme="dark"] .badge-contact {
            background: #052E16;
            color: #4ADE80;
        }

        .badge-pending {
            background: #FEF3C7;
            color: #B45309;
        }

        [data-theme="dark"] .badge-pending {
            background: #451A03;
            color: #FBBF24;
        }

        /* Search */
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            background: var(--surface);
            color: var(--text);
            transition: border-color var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box .btn {
            width: auto;
            padding: 0.65rem 1rem;
        }



        /* Shake */
        .shake {
            animation: shakeAnim 0.5s;
        }

        @keyframes shakeAnim {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Toast notification */
        .toast-container {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 90%;
            max-width: 420px;
            pointer-events: none;
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            border-left: 3px solid var(--primary);
        }

        .toast.toast-error { border-left-color: var(--danger); }
        .toast.toast-success { border-left-color: var(--success); }
        .toast.toast-buzz { border-left-color: var(--warning); }

        .toast .toast-icon { font-size: 1.25rem; }
        .toast .toast-text { font-size: 0.85rem; color: var(--text); flex: 1; }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (min-width: 640px) {
            #app { max-width: 560px; }
            body { align-items: center; padding: 1rem; }
            #app { min-height: auto; border-radius: 20px; box-shadow: var(--shadow-lg); max-height: 95vh; }
            .tab-content { max-height: calc(95vh - 200px); }
            .app-header { border-radius: 20px 20px 0 0; }
        }

        @media (min-width: 1024px) {
            body { padding: 2rem; }
            #app { max-width: 600px; }
        }

        @media (display-mode: standalone) {
            .app-header { padding-top: env(safe-area-inset-top, 0.75rem); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="auth-section" class="screen">
            <div class="auth-card">
                <div class="logo">🔔</div>
                <h1>Zumbido</h1>
                <p class="subtitle">Conecta con tus contactos al instante</p>
                <button id="login-btn" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 48 48" fill="none"><path d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/><path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/><path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/><path d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238c-.438.398 6.591-4.807 6.591-14.807 0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/></svg>
                    Ingresar con Google
                </button>
            </div>
        </div>

        <div id="main-section" class="screen hidden">
            <header class="app-header">
                <div class="header-left">
                    <span class="logo-icon">🔔</span>
                    <span class="logo-text">Zumbido</span>
                </div>
                <div class="header-right">
                    <button id="sound-toggle" class="icon-btn" title="Activar/desactivar sonido">🔊</button>
                    <button id="theme-toggle" class="icon-btn" title="Cambiar tema">🌙</button>
                    <button id="logout-btn" class="icon-btn" title="Desconectar">✕</button>
                </div>
            </header>

            <div class="user-card">
                <img id="user-photo" class="avatar" alt="">
                <div class="user-info">
                    <span id="user-name" class="user-name"></span>
                    <span id="user-status" class="user-status online">● Disponible</span>
                </div>
            </div>

            <nav class="tab-bar" role="tablist">
                <button class="tab active" data-tab="contacts" role="tab">Contactos</button>
                <button class="tab" data-tab="requests" role="tab">
                    Solicitudes
                    <span id="requests-badge" class="badge hidden">0</span>
                </button>
                <button class="tab" data-tab="search" role="tab">Buscar</button>
            </nav>

            <div class="tab-content">
                <div id="tab-contacts" class="tab-pane active" role="tabpanel">
                    <div id="contacts-list">
                        <p class="empty-msg">Cargando contactos...</p>
                    </div>
                </div>

                <div id="tab-requests" class="tab-pane" role="tabpanel">
                    <div id="requests-section">
                        <h3 class="section-title">Solicitudes Pendientes</h3>
                        <div id="requests-list"></div>
                    </div>
                    <div id="sent-section">
                        <h3 class="section-title">Solicitudes Enviadas</h3>
                        <div id="sent-list"></div>
                    </div>
                </div>

                <div id="tab-search" class="tab-pane" role="tabpanel">
                    <div class="search-box">
                        <input id="search-input" type="text" placeholder="Nombre o email..." autocomplete="off">
                        <button id="search-btn" class="btn btn-primary">Buscar</button>
                    </div>
                    <div id="search-results">
                        <p class="empty-msg">Busca usuarios por nombre o email para agregar como contacto.</p>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, getDocs, serverTimestamp, query, where, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAl_jrOOxnMuBpWGRB_dxdvao39GMhlV-Y",
            authDomain: "studio-1888292451-fc60d.firebaseapp.com",
            projectId: "studio-1888292451-fc60d",
            storageBucket: "studio-1888292451-fc60d.firebasestorage.app",
            messagingSenderId: "873003768289",
            appId: "1:873003768289:web:5e3d7a85ebaea725469aa0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        let messaging;
        try { messaging = getMessaging(app); } catch (e) { console.log("FCM not available"); }

        const sessionDeviceId = Math.random().toString(36).substring(7);
        let contactUids = new Set();
        let sentRequestUids = new Set();
        let unsubContacts = null;
        let unsubIncoming = null;
        let unsubOutgoing = null;
        let unsubBuzzes = null;
        let contactStatusUnsubs = new Map();

        const els = {
            auth: document.getElementById('auth-section'),
            main: document.getElementById('main-section'),
            userName: document.getElementById('user-name'),
            userPhoto: document.getElementById('user-photo'),
            userStatus: document.getElementById('user-status'),
            contactsList: document.getElementById('contacts-list'),
            requestsList: document.getElementById('requests-list'),
            requestsSection: document.getElementById('requests-section'),
            sentList: document.getElementById('sent-list'),
            sentSection: document.getElementById('sent-section'),
            searchInput: document.getElementById('search-input'),
            searchResults: document.getElementById('search-results'),
            requestsBadge: document.getElementById('requests-badge'),
            log: document.getElementById('log'),
            soundToggle: document.getElementById('sound-toggle'),
            themeToggle: document.getElementById('theme-toggle'),
            toastContainer: document.getElementById('toast-container')
        };

        // ============================================================
        // THEME
        // ============================================================

        function getPreferredTheme() {
            const saved = localStorage.getItem('zumbido-theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('zumbido-theme', theme);
            els.themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        setTheme(getPreferredTheme());

        els.themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ============================================================
        // SOUND
        // ============================================================

        let soundEnabled = localStorage.getItem('zumbido-sound') !== 'off';

        function updateSoundUI() {
            els.soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        }

        updateSoundUI();

        els.soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('zumbido-sound', soundEnabled ? 'on' : 'off');
            updateSoundUI();
        });

        // ============================================================
        // LOGGER
        // ============================================================

        function log(msg, type) {
            console.log(`[${type || 'info'}] ${msg}`);
        }

        // ============================================================
        // TOAST
        // ============================================================

        function showToast(msg, type, duration) {
            const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'buzz' ? '🔔' : 'ℹ️';
            const toast = document.createElement('div');
            toast.className = `toast toast-${type || 'info'}`;
            toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-text">${msg}</span><button class="toast-close">✕</button>`;
            toast.querySelector('.toast-close').onclick = () => toast.remove();
            els.toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration || 3000);
        }

        // ============================================================
        // AUTH
        // ============================================================

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(() => log("Inicio de sesión exitoso", 'success'))
                .catch(err => log("Error al iniciar sesión: " + err.message, 'error'));
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            setUserOnline(false);
            if (unsubContacts) unsubContacts();
            if (unsubIncoming) unsubIncoming();
            if (unsubOutgoing) unsubOutgoing();
            if (unsubBuzzes) unsubBuzzes();
            cleanupContactStatusListeners();
            signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                log("Usuario autenticado: " + user.displayName, 'success');
                els.userName.textContent = user.displayName;
                els.userPhoto.src = user.photoURL || '';
                els.auth.classList.add('hidden');
                els.main.classList.remove('hidden');

                contactUids = new Set();
                sentRequestUids = new Set();

                try {
                    await setDoc(doc(db, "users", user.uid), {
                        displayName: user.displayName,
                        photoURL: user.photoURL,
                        email: user.email,
                        lastSeen: serverTimestamp()
                    }, { merge: true });
                    setUserOnline(true);
                } catch (e) {
                    log("Error al guardar perfil: " + e.message, 'error');
                }

                if (unsubContacts) unsubContacts();
                if (unsubIncoming) unsubIncoming();
                if (unsubOutgoing) unsubOutgoing();
                if (unsubBuzzes) unsubBuzzes();
                cleanupContactStatusListeners();

                listenForContacts(user);
                listenForIncomingRequests(user);
                listenForOutgoingRequests(user);
                listenForBuzzes(user);
                setupFCM(user);
            } else {
                els.auth.classList.remove('hidden');
                els.main.classList.add('hidden');
            }
        });

        function setUserOnline(online) {
            const user = auth.currentUser;
            if (!user) return;
            setDoc(doc(db, "users", user.uid), { online, lastSeen: serverTimestamp() }, { merge: true }).catch(() => {});
        }

        window.addEventListener('beforeunload', () => setUserOnline(false));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setUserOnline(true);
            }
        });

        // ============================================================
        // FCM
        // ============================================================

        async function setupFCM(user) {
            if (!messaging || !('Notification' in window)) return;
            try {
                if (Notification.permission === 'default') {
                    await Notification.requestPermission();
                }
                if (Notification.permission !== 'granted') return;

                const token = await getToken(messaging, {
                    vapidKey: 'BIUGgod_FWatCX8GCwJvEX_41CgKO-_r4V52zejT2WgogzEerpNBth3-G_45mww1SFP3gwMjHG09aysieBVs1gA'
                });

                if (token) {
                    await setDoc(doc(db, "users", user.uid, "fcmTokens", sessionDeviceId), {
                        token,
                        deviceId: sessionDeviceId,
                        userAgent: navigator.userAgent,
                        createdAt: serverTimestamp()
                    }, { merge: true });
                    log("FCM listo para notificaciones push", 'success');
                }

                onMessage(messaging, (payload) => {
                    const d = payload.data || {};
                    if (d.type === 'buzz') {
                        log("¡ZUMBIDO recibido (FCM)!", 'buzz');
                        showToast("🔔 " + (d.from || 'Alguien') + " te ha enviado un zumbido", 'buzz');
                        triggerShake();
                        if (soundEnabled) playSound();
                    }
                });
            } catch (e) {
                log("FCM no disponible: " + e.message, 'error');
            }
        }

        // ============================================================
        // TABS
        // ============================================================

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                const pane = document.getElementById('tab-' + tab.dataset.tab);
                if (pane) pane.classList.add('active');
            });
        });

        // ============================================================
        // LISTENERS
        // ============================================================

        function listenForContacts(user) {
            const q = query(collection(db, "contacts", user.uid, "list"), limit(50));
            unsubContacts = onSnapshot(q, (snap) => {
                els.contactsList.innerHTML = '';
                contactUids = new Set();
                cleanupContactStatusListeners();

                if (snap.empty) {
                    els.contactsList.innerHTML = '<p class="empty-msg">No tienes contactos aún. Busca usuarios para agregar.</p>';
                    return;
                }

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const contactId = docSnap.id;
                    contactUids.add(contactId);

                    const el = document.createElement('div');
                    el.className = 'item';
                    el.dataset.uid = contactId;
                    el.innerHTML = `
                        <div class="status-dot offline" id="status-${contactId}"></div>
                        <img src="${escapeHtml(data.photoURL || '')}" class="avatar-sm" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23E2E8F0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%2394A3B8%22>👤</text></svg>'">
                        <span class="name">${escapeHtml(data.displayName)}</span>
                        <button class="buzz-btn" title="¡Zumbar!">🔔</button>
                    `;
                    el.querySelector('.buzz-btn').onclick = () => sendBuzz(contactId, data.displayName);
                    els.contactsList.appendChild(el);

                    listenForContactStatus(contactId);
                });
            });
        }

        function listenForContactStatus(uid) {
            const unsub = onSnapshot(doc(db, "users", uid), (snap) => {
                const data = snap.data();
                const dot = document.getElementById('status-' + uid);
                if (dot) {
                    if (data && data.online) {
                        dot.className = 'status-dot online';
                    } else {
                        dot.className = 'status-dot offline';
                    }
                }
            });
            contactStatusUnsubs.set(uid, unsub);
        }

        function cleanupContactStatusListeners() {
            contactStatusUnsubs.forEach(u => u());
            contactStatusUnsubs.clear();
        }

        function listenForIncomingRequests(user) {
            const q = query(
                collection(db, "contactRequests"),
                where("to", "==", user.uid),
                where("status", "==", "pending")
            );
            unsubIncoming = onSnapshot(q, (snap) => {
                els.requestsList.innerHTML = '';
                let count = 0;

                if (snap.empty) {
                    els.requestsSection.classList.add('hidden');
                    els.requestsBadge.classList.add('hidden');
                    return;
                }

                els.requestsSection.classList.remove('hidden');

                snap.forEach(docSnap => {
                    count++;
                    const data = docSnap.data();
                    const el = document.createElement('div');
                    el.className = 'item';
                    el.innerHTML = `
                        <img src="${escapeHtml(data.fromPhoto || '')}" class="avatar-sm" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23E2E8F0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%2394A3B8%22>👤</text></svg>'">
                        <span class="name">${escapeHtml(data.fromName)}</span>
                        <div class="item-actions">
                            <button class="btn-sm btn-accept" data-request-id="${docSnap.id}" data-from-uid="${escapeHtml(data.from)}" data-from-name="${escapeHtml(data.fromName)}" data-from-photo="${escapeHtml(data.fromPhoto || '')}">✅</button>
                            <button class="btn-sm btn-reject" data-request-id="${docSnap.id}">❌</button>
                        </div>
                    `;
                    el.querySelector('.btn-accept').onclick = (e) => {
                        const btn = e.currentTarget;
                        acceptRequest(btn.dataset.requestId, btn.dataset.fromUid, btn.dataset.fromName, btn.dataset.fromPhoto);
                    };
                    el.querySelector('.btn-reject').onclick = (e) => {
                        rejectRequest(e.currentTarget.dataset.requestId);
                    };
                    els.requestsList.appendChild(el);
                });

                if (count > 0) {
                    els.requestsBadge.textContent = count;
                    els.requestsBadge.classList.remove('hidden');
                } else {
                    els.requestsBadge.classList.add('hidden');
                }
            });
        }

        function listenForOutgoingRequests(user) {
            const q = query(
                collection(db, "contactRequests"),
                where("from", "==", user.uid),
                where("status", "==", "pending")
            );
            unsubOutgoing = onSnapshot(q, (snap) => {
                els.sentList.innerHTML = '';
                sentRequestUids = new Set();

                if (snap.empty) {
                    els.sentSection.classList.add('hidden');
                    return;
                }

                els.sentSection.classList.remove('hidden');

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    sentRequestUids.add(data.to);

                    const el = document.createElement('div');
                    el.className = 'item';
                    el.innerHTML = `
                        <img src="${escapeHtml(data.toPhoto || '')}" class="avatar-sm" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23E2E8F0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%2394A3B8%22>👤</text></svg>'">
                        <span class="name">${escapeHtml(data.toName)}</span>
                        <span class="badge-label badge-pending">Pendiente</span>
                        <button class="btn-sm btn-cancel" data-request-id="${docSnap.id}">✕</button>
                    `;
                    el.querySelector('.btn-cancel').onclick = (e) => {
                        cancelRequest(e.currentTarget.dataset.requestId);
                    };
                    els.sentList.appendChild(el);
                });
            });
        }

        function listenForBuzzes(user) {
            log("Escuchando zumbidos...", 'info');
            const q = query(collection(db, "buzzes"), where("toUid", "==", user.uid));
            let appStartTime = Date.now();

            unsubBuzzes = onSnapshot(q, (snap) => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const buzzTime = data.timestamp ? data.timestamp.toMillis() : Date.now();
                        if (buzzTime > appStartTime - 10000 && data.deviceId !== sessionDeviceId) {
                            log("¡ZUMBIDO de " + data.from + "!", 'buzz');
                            showToast("🔔 " + data.from + " te ha enviado un zumbido", 'buzz');
                            triggerShake();
                            if (soundEnabled) playSound();
                            showBrowserNotification(data.from);
                        }
                    }
                });
            }, (error) => {
                log("Error en listener de zumbidos: " + error.message, 'error');
            });
        }

        // ============================================================
        // CONTACT REQUESTS
        // ============================================================

        async function sendContactRequest(toUid, toName, toPhoto) {
            const user = auth.currentUser;
            if (!user) return;
            if (sentRequestUids.has(toUid)) {
                log("Ya enviaste una solicitud a " + toName, 'info');
                return;
            }
            log("Enviando solicitud a " + toName, 'info');
            try {
                await addDoc(collection(db, "contactRequests"), {
                    from: user.uid,
                    fromName: user.displayName,
                    fromPhoto: user.photoURL || '',
                    to: toUid,
                    toName,
                    toPhoto: toPhoto || '',
                    status: "pending",
                    timestamp: serverTimestamp()
                });
                log("Solicitud enviada a " + toName, 'success');
                showToast("Solicitud enviada a " + toName, 'success');
            } catch (e) {
                log("Error al enviar solicitud: " + e.message, 'error');
                showToast("Error al enviar solicitud", 'error');
            }
        }

        async function acceptRequest(requestId, fromUid, fromName, fromPhoto) {
            const user = auth.currentUser;
            if (!user) return;
            log("Aceptando solicitud de " + fromName, 'info');
            try {
                await setDoc(doc(db, "contacts", user.uid, "list", fromUid), {
                    displayName: fromName,
                    photoURL: fromPhoto,
                    addedAt: serverTimestamp()
                });
                await setDoc(doc(db, "contacts", fromUid, "list", user.uid), {
                    displayName: user.displayName,
                    photoURL: user.photoURL || '',
                    addedAt: serverTimestamp()
                });
                await deleteDoc(doc(db, "contactRequests", requestId));
                log("Contacto agregado: " + fromName, 'success');
                showToast("¡" + fromName + " ahora es tu contacto!", 'success');
            } catch (e) {
                log("Error al aceptar solicitud: " + e.message, 'error');
                showToast("Error al aceptar solicitud", 'error');
            }
        }

        async function rejectRequest(requestId) {
            try {
                await deleteDoc(doc(db, "contactRequests", requestId));
                log("Solicitud rechazada", 'info');
            } catch (e) {
                log("Error al rechazar solicitud: " + e.message, 'error');
            }
        }

        async function cancelRequest(requestId) {
            try {
                await deleteDoc(doc(db, "contactRequests", requestId));
                log("Solicitud cancelada", 'info');
            } catch (e) {
                log("Error al cancelar solicitud: " + e.message, 'error');
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================

        async function handleSearch() {
            const term = els.searchInput.value.trim();
            if (!term) return;
            await searchUsers(term);
        }

        els.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });
        document.getElementById('search-btn').addEventListener('click', handleSearch);

        async function searchUsers(term) {
            const user = auth.currentUser;
            if (!user) return;
            log("Buscando: " + term, 'info');
            els.searchResults.innerHTML = '<div class="spinner"></div>';

            const foundUids = new Set();
            const results = [];

            try {
                const q1 = query(
                    collection(db, "users"),
                    where("displayName", ">=", term),
                    where("displayName", "<=", term + "\uf8ff"),
                    limit(15)
                );
                const snap1 = await getDocs(q1);
                snap1.forEach(docSnap => {
                    if (docSnap.id !== user.uid && !foundUids.has(docSnap.id)) {
                        foundUids.add(docSnap.id);
                        results.push({ uid: docSnap.id, ...docSnap.data() });
                    }
                });

                if (term.includes('@')) {
                    const q2 = query(
                        collection(db, "users"),
                        where("email", "==", term.toLowerCase()),
                        limit(5)
                    );
                    const snap2 = await getDocs(q2);
                    snap2.forEach(docSnap => {
                        if (docSnap.id !== user.uid && !foundUids.has(docSnap.id)) {
                            foundUids.add(docSnap.id);
                            results.push({ uid: docSnap.id, ...docSnap.data() });
                        }
                    });
                }
            } catch (e) {
                log("Error en búsqueda: " + e.message, 'error');
                els.searchResults.innerHTML = '<p class="empty-msg">Error al buscar. Intenta de nuevo.</p>';
                return;
            }

            if (results.length === 0) {
                els.searchResults.innerHTML = `<p class="empty-msg">Sin resultados para "${escapeHtml(term)}".</p>`;
                return;
            }

            els.searchResults.innerHTML = '';
            results.forEach(r => {
                const isContact = contactUids.has(r.uid);
                const isPending = sentRequestUids.has(r.uid);

                const el = document.createElement('div');
                el.className = 'item';

                let actionHtml = '';
                if (isContact) {
                    actionHtml = `<span class="badge-label badge-contact">Contacto</span>`;
                } else if (isPending) {
                    actionHtml = `<span class="badge-label badge-pending">Pendiente</span>`;
                } else {
                    actionHtml = `<button class="btn-sm btn-add" data-uid="${escapeHtml(r.uid)}" data-name="${escapeHtml(r.displayName)}" data-photo="${escapeHtml(r.photoURL || '')}">➕</button>`;
                }

                el.innerHTML = `
                    <img src="${escapeHtml(r.photoURL || '')}" class="avatar-sm" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23E2E8F0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%2394A3B8%22>👤</text></svg>'">
                    <span class="name">${escapeHtml(r.displayName)}</span>
                    ${actionHtml}
                `;

                const addBtn = el.querySelector('.btn-add');
                if (addBtn) {
                    addBtn.onclick = () => sendContactRequest(r.uid, r.displayName, r.photoURL || '');
                }

                els.searchResults.appendChild(el);
            });
        }

        // ============================================================
        // BUZZ
        // ============================================================

        async function sendBuzz(toUid, toName) {
            const user = auth.currentUser;
            if (!user) return;
            log("Enviando zumbido a " + toName, 'info');
            try {
                await addDoc(collection(db, "buzzes"), {
                    toUid,
                    toName,
                    from: user.displayName,
                    fromUid: user.uid,
                    timestamp: serverTimestamp(),
                    deviceId: sessionDeviceId
                });
                showToast("🔔 Zumbido enviado a " + toName, 'success');
                triggerShake();
            } catch (e) {
                log("Error al enviar zumbido: " + e.message, 'error');
                showToast("Error al enviar zumbido", 'error');
            }
        }

        function triggerShake() {
            const app = document.getElementById('app');
            app.classList.remove('shake');
            void app.offsetWidth;
            app.classList.add('shake');
            setTimeout(() => app.classList.remove('shake'), 500);
        }

        function playSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                // Audio not available
            }
        }

        // ============================================================
        // BROWSER NOTIFICATION
        // ============================================================

        function showBrowserNotification(from) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            try {
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification("¡ZUMBIDO!", {
                        body: from + " te ha enviado un zumbido",
                        icon: "icon-192.svg",
                        badge: "icon-192.svg",
                        vibrate: [200, 100, 200],
                        requireInteraction: true,
                        tag: "zumbido-" + Date.now()
                    });
                });
            } catch (e) {
                new Notification("¡ZUMBIDO!", {
                    body: from + " te ha enviado un zumbido",
                    icon: "icon-192.svg"
                });
            }
        }

        // ============================================================
        // HELPERS
        // ============================================================

        function escapeHtml(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ============================================================
        // SERVICE WORKER
        // ============================================================

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => log("Service Worker registrado.", 'success'))
                    .catch(err => log("Error SW: " + err.message, 'error'));
            });
        }

        // ============================================================
        // NOTIFICATION PERMISSION
        // ============================================================

        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }

        log("Zumbido 2.0 iniciado", 'info');
        console.log("Zumbido 2.0 - Disfruta!");
    </script>
